<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手写于日常 · 照片工作台</title><style>
.dropzone{border:2px dashed #cbcfc1;border-radius:12px;padding:14px;margin-bottom:14px;transition:background .15s,border-color .15s}.dropzone label{margin:0 0 6px}.dropzone p{font-size:13px;margin-bottom:10px}.dropzone.over{background:#e7eedf;border-color:#52654c}.layerItem{text-align:left;overflow-wrap:anywhere;margin-top:8px!important}.layerItem.selected{background:#52654c!important;color:#fff!important}button:disabled{opacity:.4;cursor:default}#exportPanel:not([hidden]){position:fixed;inset:0;z-index:99;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.exportCard{background:#fffdf8;border-radius:16px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}#exportImage{display:block;max-width:100%;max-height:45vh;object-fit:contain;margin:14px auto;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/16px 16px}#cropPanel:not([hidden]){position:fixed;inset:0;z-index:100;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}.cropCard{width:min(820px,100%)}#cropCanvas{display:block;max-width:100%;max-height:55vh;width:auto;height:auto;margin:16px auto;touch-action:none;cursor:crosshair}*{box-sizing:border-box}body{margin:0;background:#f5f1eb;color:#292c29;font:15px system-ui}header{padding:25px 32px;border-bottom:1px solid #ddd7ce}h1{font-size:25px;margin:0 0 8px}p{color:#74776d;margin:0;line-height:1.7}.layout{display:grid;grid-template-columns:300px 1fr;gap:28px;padding:28px;max-width:1400px;margin:auto}aside{background:#fffdf8;border:1px solid #e1dbd1;border-radius:18px;padding:24px}label{display:block;margin:20px 0 8px;font-weight:600}input[type=range]{width:100%;accent-color:#52654c}input[type=file]{width:100%;font-size:12px}button{padding:12px 16px;border:0;border-radius:9px;background:#52654c;color:white;cursor:pointer;margin-top:14px;width:100%;font:inherit}button.secondary{background:#eaece4;color:#3e4c39}.preview{min-width:0;text-align:center}canvas#stage{width:100%;max-width:800px;height:auto;border-radius:12px;box-shadow:0 12px 36px #382f241c;touch-action:none;cursor:grab}#cut{width:100%;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/16px 16px;border-radius:6px;margin-top:12px}.hint{font-size:12px;margin-top:12px}output{float:right;font-weight:400;color:#777} @media(max-width:750px){.layout{grid-template-columns:1fr;padding:16px}aside{order:2}header{padding:20px}}
</style><header><h1>手写于日常</h1><p>留下你的笔迹，把它放到喜欢的位置。图片仅在当前浏览器中处理。</p></header><div class="layout"><aside>
<div class="dropzone" id="bgdrop"><label>背景照片</label><p>把背景图片拖到这里</p><input id="bgfile" type="file" accept="image/*"></div><div class="dropzone" id="inkdrop"><label>添加手写照片（可多选）</label><p>把一张或多张手写图片拖到这里</p><input id="inkfile" type="file" accept="image/*" multiple></div><p class="hint">默认展示示例照片；也可以从相册选择或拖入图片。</p>
<label>手写图层</label><p id="layerCount" class="hint"></p><div id="layers"></div><button id="deleteLayer" class="secondary">删除所选手写</button><p class="hint">先点选图层，再调整下方参数；新添加的手写不会替换已有手写。</p><label>去背景强度 <output id="thresholdVal"></output></label><input id="threshold" type="range" min="45" max="185" value="110"><p class="hint">往右保留更多浅色笔画；往左去除更多纸张杂点。</p>
<button id="cropOpen" class="secondary">框选所选手写的保留区域</button><p class="hint">在原图上框出文字，排除框外阴影和杂物。</p><canvas id="cut"></canvas><label>文字大小 <output id="scaleVal"></output></label><input id="scale" type="range" min="5" max="120" value="62">
<label>旋转 <output id="angleVal"></output></label><input id="angle" type="range" min="-180" max="180" value="0">
<label>透明度 <output id="opacityVal"></output></label><input id="opacity" type="range" min="10" max="100" value="100"><label>笔迹颜色</label><input id="color" type="color" value="#25231f">
<button id="album">保存合成图到相册 / 分享</button><button id="albumInk" class="secondary">保存所选手写到相册 / 分享</button><p class="hint">iPhone：打开预览后点击分享，选择「保存图像」。</p><button id="save">下载合成照片 PNG</button><button id="saveInk" class="secondary">下载所选透明手写 PNG</button><button id="reset" class="secondary">位置居中</button></aside><main class="preview"><canvas id="stage"></canvas><p class="hint">按住文字拖动位置 · 用左侧滑杆调整大小和角度 · 导出最长边为 2048 像素以内</p><p id="status" class="hint">正在载入照片…</p></main></div><div id="exportPanel" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden><div class="exportCard"><h2 id="exportTitle">保存图片</h2><p id="exportHint">正在准备图片…</p><img id="exportImage" alt="待保存的导出图片"><button id="shareImage" disabled>打开系统分享菜单</button><button id="downloadImage" class="secondary" disabled>下载 PNG 文件</button><button id="closeExport" class="secondary">关闭预览</button></div></div><div id="cropPanel" role="dialog" aria-modal="true" aria-labelledby="cropTitle" hidden><div class="exportCard cropCard"><h2 id="cropTitle">框选要保留的笔迹</h2><p id="cropHint"></p><canvas id="cropCanvas"></canvas><button id="cropApply">应用保留区域</button><button id="cropAll" class="secondary">恢复整张图片</button><button id="cropCancel" class="secondary">取消</button></div></div><script src="app.js?v=20261010-crop"></script></html>
